name: Notify Discord on Release

on:
  # Both manual/PAT and GITHUB_TOKEN publications are announced after
  # the release changelog workflow completes.
  workflow_run:
    workflows: [Update Release changelog]
    types: [completed]
  # Fallback for future versioned publishers, with no duplicate notices.
  schedule:
    - cron: '7,22,37,52 * * * *'
  # Manually re-send a release announcement when needed.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (leave blank for latest stable release)'
        required: false
        type: string
      force:
        description: 'Re-send even if already notified'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: discord-release-notification
  cancel-in-progress: false

jobs:
  notify:
    if: >-
      github.repository == 'NLshaen/ShaaenFCT' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event != 'push'))
    runs-on: ubuntu-latest
    steps:
      - name: Check out Discord release notifier
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Send release changelog to Discord
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RELEASE_TAG: ${{ inputs.tag }}
          FORCE_NOTIFY: ${{ inputs.force || 'false' }}
        run: python3 .github/scripts/notify_discord_release.py
