name: Publish to CurseForge

on:
  release:
    types: [published]
  # Releases created with GITHUB_TOKEN do not emit further release events.
  # workflow_run handles known automatic publishers; schedule is a fallback.
  workflow_run:
    workflows:
      - Update Release changelog
      - Release
      - Publish shaaenFCT v0.7.28
      - Publish ShaaenFCT v0.7.29
      - Publish ShaaenFCT v0.7.30
      - Publish ShaaenFCT
    types: [completed]
  # Catch releases from future publisher workflows (including GITHUB_TOKEN).
  # GitHub schedules can be delayed, so this is a backup, not a precise timer.
  schedule:
    - cron: '9,24,39,54 * * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing GitHub Release tag (e.g. v0.7.29)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: curseforge-publication
  cancel-in-progress: false

jobs:
  upload:
    if: >-
      github.repository == 'NLshaen/ShaaenFCT' &&
      vars.CURSEFORGE_PROJECT_ID != '' &&
      vars.CURSEFORGE_GAME_VERSION_IDS != '' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        (github.event.workflow_run.name != 'Update Release changelog' ||
         github.event.workflow_run.event != 'push')))
    runs-on: ubuntu-latest
    steps:
      - name: Check out uploader script
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Publish existing GitHub Release ZIP to CurseForge
        env:
          GH_TOKEN: ${{ github.token }}
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_GAME_VERSION_IDS: ${{ vars.CURSEFORGE_GAME_VERSION_IDS }}
          CURSEFORGE_RELEASE_TYPE: ${{ vars.CURSEFORGE_RELEASE_TYPE }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          WORKFLOW_RUN_NAME: ${{ github.event.workflow_run.name }}
          # Do not automatically publish older releases when adding this workflow.
          RELEASE_MAX_AGE_HOURS: ${{ github.event_name == 'schedule' && '2' || '' }}
        shell: bash
        run: |
          set -euo pipefail
          # For version-specific publishers, publish that exact release even
          # when multiple releases were created in quick succession.
          if [[ -z "${RELEASE_TAG}" && "${WORKFLOW_RUN_NAME}" =~ ^[Pp]ublish[[:space:]]+[Ss]haaenFCT[[:space:]]+(v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            export RELEASE_TAG="${BASH_REMATCH[1]}"
          fi
          python3 .github/scripts/upload_curseforge.py
