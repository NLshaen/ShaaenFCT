name: Publish ShaaenFCT v0.7.48

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v0.7.48.yml'

permissions:
  contents: write

concurrency:
  group: publish-shaaenfct-v0.7.48
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'NLshaen/ShaaenFCT'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main with full Git history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply nine feature commits, bump version, push tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin refs/tags/v0.7.48 >/dev/null 2>&1; then
            echo 'v0.7.48 already exists; refusing to move or replace the tag'
            exit 1
          fi
          # Safety: apply the local patch series only to its verified v0.7.47 base.
          test "$(git hash-object Core.lua)" = f269ab0f06585a99c0989d2d6f24a2c70d93a985
          test "$(git hash-object shaaenFCT.toc)" = 30b30920ae857d47194a4fa427cca4f3fd06b4bd
          test "$(git hash-object AnimationPreview.lua)" = 9bf6c000645d6e1b49f29de3a3afe5791704ff2d
          test "$(git hash-object README.txt)" = ada291fd6e32f3c3e2b52e7d7264acb45eaa8573

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git am .github/release-patches/v0.7.48.mbox

          python3 - <<'PY'
          from pathlib import Path
          toc = Path('shaaenFCT.toc')
          content = toc.read_text()
          assert content.count('## Version: 0.7.47') == 1
          toc.write_text(content.replace('## Version: 0.7.47', '## Version: 0.7.48'))

          readme = Path('README.txt')
          text = readme.read_text()
          text = text.replace('shaaenFCT 0.7.47 |', 'shaaenFCT 0.7.48 |', 1)
          text = text.replace('UNPUBLISHED LOCAL CHANGES (5 SEPARATE COMMITS, NO TAG OR PUSH)', 'NEW IN v0.7.48', 1)
          text = text.replace('- The addon version stays 0.7.47. No GitHub tag/release/push was created.', '- Published in v0.7.48 with nine separate feature commits.', 1)
          text = text.replace('LOCAL FEATURE BRANCH 0.7.47  (not pushed to GitHub)', 'PREVIOUS FEATURES FROM v0.7.47', 1)
          readme.write_text(text)

          md = Path('README.md')
          if md.exists():
              text = md.read_text()
              text = text.replace('Current version: **v0.7.45**.', 'Current version: **v0.7.48**.')
              text = text.replace('ShaaenFCT_v0.7.45.zip', 'ShaaenFCT_v0.7.48.zip')
              text = text.replace('/releases/download/v0.7.45/', '/releases/download/v0.7.48/')
              text = text.replace('Arc, Popup, Float and Bounce animations', 'Arc, Popup, Float, Bounce and POW animations')
              text = text.replace('window scale (75–120%) and opacity controls', 'scale (75–120%) and opacity (30–100%) controls')
              md.write_text(text)

          notifier = Path('VersionNotifier.lua')
          text = notifier.read_text()
          text = text.replace("showVersion('0.7.48', true)", "showVersion('0.7.49', true)")
          notifier.write_text(text)
          PY

          git add shaaenFCT.toc README.txt README.md VersionNotifier.lua
          git commit -m "chore: bump ShaaenFCT to v0.7.48"
          # The bootstrap files are not part of the final release source.
          git rm .github/release-patches/v0.7.48.mbox .github/workflows/publish-v0.7.48.yml
          git commit -m "ci: remove temporary v0.7.48 publication files"

          python3 - <<'PY'
          from pathlib import Path
          import shutil
          root = Path('staging/shaaenFCT')
          root.mkdir(parents=True, exist_ok=True)
          toc = Path('shaaenFCT.toc')
          assert '## Version: 0.7.48' in toc.read_text()
          files = [s.strip() for s in toc.read_text().splitlines() if s.strip() and not s.startswith('#')]
          assert 'Core.lua' in files and 'VersionNotifier.lua' in files and 'AnimationPreview.lua' in files
          for filename in files + ['shaaenFCT.toc', 'README.txt']:
              src = Path(filename.replace('\\', '/'))
              assert src.is_file(), f'Missing addon file: {src}'
              dst = root / src
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)
          print('Build files verified:', ', '.join(files))
          PY
          (cd staging && zip -qr "$GITHUB_WORKSPACE/ShaaenFCT_v0.7.48.zip" shaaenFCT)
          unzip -t ShaaenFCT_v0.7.48.zip
          git status --short
          git tag -a v0.7.48 -m "ShaaenFCT v0.7.48"
          git push origin HEAD:main refs/tags/v0.7.48

          cat > release-notes.md <<'NOTES'
          ## New features
          - A fifth **POW** animation tab with native Blizzard FCT-inspired critical-hit scaling, scrolling, and fade.
          - Independent POW **horizontal** and **vertical** direction controls, with Left/Right/Alternate/Random and Up/Down/Alternate/Random selections.
          - Updated typography on ON/OFF slider switches.
          - GitHub Releases link popup when a newer ShaaenFCT version is detected on another player's addon.

          ## Improvements and fixes
          - Renamed the native text mode to **Blizzard FCT**.
          - Disables supported native Blizzard floating-combat-text CVars (including available XP aliases) when Blizzard FCT is OFF, restoring previous values when selected.
          - Top-bar scale control renamed to **SCALE**, and minimum settings-window opacity increased to 30%.
          - POW motion adjusted toward native Blizzard FCT's fast critical pop and scrolling.

          ## Important compatibility notes
          - Built for **WoW Forever** (Interface 16001).
          - WoW addons cannot directly query GitHub; update prompts depend on in-game peer version announcements and do not independently verify a published GitHub release.
          - Some WoW Forever XP notifications have no supported CVar and may still appear.
          - Combat values remain subject to WoW Forever's protected-value restrictions.
          - The code has passed local syntax and mocked tests; live gameplay testing remains recommended.

          ## Installation
          Extract the shaaenFCT folder from the ZIP to Interface/AddOns/, then enter /reload.
          NOTES

          gh release create v0.7.48 ShaaenFCT_v0.7.48.zip \
            --repo NLshaen/ShaaenFCT \
            --title "ShaaenFCT_v0.7.48" \
            --notes-file release-notes.md \
            --latest
